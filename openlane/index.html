  var STORE = 'sambitux-openlane-key';
  var bytes = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };
  function decrypt(keyBits) {
    return crypto.subtle.importKey('raw', keyBits, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, k, bytes(DATA.ct)); })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (b) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iterations, hash: 'SHA-256' }, b, 256); });
  }
  // Replace the lock screen only once it has fully loaded; swapping it mid-load would merge the two pages.
  function track(name, title) {
    try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: title, event: true }); } catch (e) {}
  }
  function show(html, event, title) {
    var swap = function () { track(event, title); document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') swap(); else window.addEventListener('load', swap, { once: true });
  }
  function ready() { document.body.classList.remove('checking'); document.getElementById('pw').focus(); }
  document.getElementById('copyEmail').addEventListener('click', function () {
    var b = this, email = 'sambitmohanty2707@gmail.com';
    var ok = function () { b.textContent = 'Copied \u2713'; setTimeout(function () { b.textContent = 'Copy email'; }, 1800); };

  var saved = null; try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) decrypt(bytes(saved)).then(function (h) { show(h, 'openlane-unlocked-returning', 'Openlane opened again (already unlocked)'); }, function () { try { localStorage.removeItem(STORE); } catch (e) {} ready(); });
  else ready();
  document.getElementById('unlock').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Unlocking\u2026'; err.textContent = '';
    var bits;
    derive(document.getElementById('pw').value)
      .then(function (b) { bits = b; return decrypt(b); })
      .then(function (html) { try { localStorage.setItem(STORE, toB64(bits)); } catch (e) {} show(html, 'openlane-unlocked-password', 'Openlane unlocked with password'); })
      .catch(function () { track('openlane-wrong-password', 'Openlane: wrong password'); err.textContent = "That password didn't work. Please try again."; btn.disabled = false; btn.textContent = 'Unlock case study'; });
